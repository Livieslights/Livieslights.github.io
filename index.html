/* =====================================
   LIVIE LIGHTS
   Scrapbook • Hippie • Denim • Pink
===================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f8eee7;
    color: #3e3439;
    line-height: 1.6;
    overflow-x: hidden;
}

/* =====================================
   BACKGROUND
===================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .18;
    z-index: 999;

    background-image:
        radial-gradient(#8c6d60 0.7px, transparent 0.7px);

    background-size: 7px 7px;
}

/* =====================================
   NAV
===================================== */

nav {
    position: sticky;
    top: 0;
    z-index: 100;

    padding: 14px;

    background: #fff8f3;
    border-bottom: 2px dashed #d88ca7;

    text-align: center;
}

nav a {
    color: #4c3d43;
    text-decoration: none;

    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;

    margin: 0 9px;
}

nav a:hover {
    color: #d64d82;
}

/* =====================================
   HERO
===================================== */

.hero {
    min-height: 95vh;

    position: relative;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 70px 7%;

    background:
        radial-gradient(circle at 15% 20%, #ffd0df 0 5%, transparent 5.5%),
        radial-gradient(circle at 90% 18%, #d7e5d0 0 5%, transparent 5.5%),
        linear-gradient(135deg, #fff8f3, #f8dce7);
}

.hero-content {
    position: relative;
    z-index: 5;

    max-width: 900px;

    text-align: center;
}

/* scrapbook tape */

.tape {
    position: absolute;

    width: 130px;
    height: 35px;

    background: rgba(247, 207, 165, .72);

    transform: rotate(-6deg);

    opacity: .8;
}

.tape.one {
    top: 7%;
    left: 8%;
}

.tape.two {
    right: 7%;
    bottom: 10%;

    transform: rotate(8deg);
}
